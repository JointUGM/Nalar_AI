# S5 teacher class-insight guards (design doc §6). Owned by the pedagogy lead.
# Bump `version` on every change.
version: 4

# AI-4: the insight never states a count. Whole-word match after normalize_key
# ("rata-rata" becomes "rata rata"). Provided names and statements are exempt.
numbers:
  number_words:
    - nol
    - satu
    - dua
    - tiga
    - empat
    - lima
    - enam
    - tujuh
    - delapan
    - sembilan
    - sepuluh
    - sebelas
    - belas
    - puluh
    - seratus
    - ratus
    - seribu
    - ribu
    - juta
    - setengah
    - separuh
    - sepertiga
    - seperempat
    - persen
    - kedua
    - ketiga
    - keempat
    - kelima
    - berdua
    - bertiga
  count_claims:
    - semua siswa
    - seluruh siswa
    - semua murid
    - seluruh kelas
    - hampir semua
    - mayoritas
    - minoritas
    - kebanyakan
    - sebagian besar
    - sebagian kecil
    - banyak siswa
    - sedikit siswa
    - setiap siswa
    - tidak ada siswa
    - tak seorang pun

insight:
  narrative_max_words: 120
  explanation_max_words: 50
  name_max_words: 8
  max_clusters: 6
  max_suggestions: 3
  suggestion_max_words: 60
  suggestion_max_chars: 600
